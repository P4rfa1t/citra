name: Build Nintendo Switch core

# 给 libretro/citra 补上 Nintendo Switch (libNX) 构建
#
# 产物: citra_libretro_libnx.nro —— 直接丢进 SD 卡 /retroarch/cores/
#
# Switch 上一个 NRO 只能静态链接一个核心，所以流程是两步：
#   1) 编出静态库 citra_libretro_libnx.a
#   2) 把 .a 塞进 RetroArch 前端，make -f Makefile.libnx LIBRETRO=citra
#      产出一个自带 citra 的 retroarch_switch.nro

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'externals/**'
      - 'Makefile'
      - 'Makefile.common'
      - '.github/workflows/**'

concurrency:
  group: switch-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: citra_libretro_libnx.a
    runs-on: ubuntu-latest
    container:
      image: reallibretroretroarch/libretro-build-libnx-devkitpro:v4-10-0
      options: -u root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          $DEVKITARM/bin/aarch64-none-elf-g++ --version | head -1
          ls $DEVKITPRO/libnx/switch_rules

      - name: Prepare build environment
        run: |
          # 容器内 checkout 出来的文件属主与当前用户不同，git 会拒绝访问
          git config --global --add safe.directory "$(pwd)"
          git config --global --add safe.directory '*'
          # citra 的 Makefile 在 all: 目标前强制要求 glslang，
          # 即使 libnx 平台不需要编 Vulkan 着色器也会检查，得装上
          if ! which glslang >/dev/null 2>&1 && ! which glslangValidator >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends glslang-tools
          fi
          glslang --version || glslangValidator --version

      - name: Sanity check tree
        run: |
          test -f Makefile
          test -f externals/libretro-common/include/libretro.h
          test -f externals/switch-compat/src/switch-compat.c
          test -f externals/glad/src/glad.c
          echo "源码树完整"

      - name: Patch libressl compat headers for libnx
        run: |
          # libressl 的 compat 层假设「非 Windows 平台一定有 syslog.h / clock_gettime」，
          # 但 libnx 两个都没有。最省事的做法是让它走 Windows 那条自带实现的分支。
          #
          # 1) compat/syslog.h：把 _WIN32 判断扩展成「libnx 也算」，
          #    这样会启用它自带的 LOG_* 常量、struct syslog_data、syslog_r/vsyslog_r。
          syslog_h=externals/libressl/include/compat/syslog.h
          test -f "$syslog_h" || { echo "找不到 $syslog_h"; exit 1; }
          sed -i 's/^#ifndef _WIN32$/#if !defined(_WIN32) \&\& defined(HAVE_SYSLOG_H)/' "$syslog_h"
          sed -i 's/^#ifdef _WIN32$/#if !defined(HAVE_SYSLOG_H)/' "$syslog_h"

          # 2) syslog_r.c 用了 va_list 却没 include <stdarg.h>
          syslog_c=externals/libressl/crypto/compat/syslog_r.c
          grep -q 'stdarg.h' "$syslog_c" || sed -i '1i #include <stdarg.h>' "$syslog_c"

          # 3) compat/time.h：libnx 有 clock_gettime，但 clockid_t 与 libressl
          #    的 typedef int 冲突，声明 HAVE_CLOCK_GETTIME 让它跳过重复定义。
          echo "--- syslog.h 前 22 行"
          head -22 "$syslog_h"
          echo "--- syslog_r.c 前 3 行"
          head -3 "$syslog_c"

      - name: Build
        run: |
          # libressl 的 LIBRESSLFLAGS 里没有 HAVE_* 定义，
          # 通过 LIBS 之外的途径注入不方便，直接在源码里补 config 头更稳。
          echo '/* libnx build config for bundled libressl */' > externals/libressl/include/compat/libnx-config.h
          printf '#ifndef LIBNX_LIBRESSL_CONFIG_H\n#define LIBNX_LIBRESSL_CONFIG_H\n#define HAVE_CLOCK_GETTIME 1\n#define HAVE_TIMEGM 1\n#define HAVE_TIMESPECSUB 1\n#endif\n' >> externals/libressl/include/compat/libnx-config.h
          # 让 compat 头自动包含它
          for h in time.h syslog.h; do
            f=externals/libressl/include/compat/$h
            grep -q 'libnx-config.h' "$f" || sed -i '1i #include "libnx-config.h"' "$f"
          done
          make -j"$(nproc)" platform=libnx
          ls -la citra_libretro_libnx.a

      - name: Upload static lib
        uses: actions/upload-artifact@v4
        with:
          name: citra-libnx-static
          path: citra_libretro_libnx.a
          retention-days: 7
          if-no-files-found: error

  nro:
    name: citra_libretro_libnx.nro
    needs: core
    runs-on: ubuntu-latest
    container:
      image: reallibretroretroarch/libretro-build-libnx-devkitpro:v4-10-0
      options: -u root
    steps:
      - name: Checkout (for .info)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dist
          sparse-checkout-cone-mode: true

      - name: Fetch RetroArch
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 https://github.com/libretro/RetroArch.git retroarch
          cd retroarch
          # 前端编译不需要完整子模块，但 libretro-common 是必须的
          git submodule update --init --depth 1 deps/libretro-common || true
          test -f Makefile.libnx

      - name: Get core static lib
        uses: actions/download-artifact@v4
        with:
          name: citra-libnx-static
          path: retroarch

      - name: Link and produce NRO
        run: |
          cd retroarch
          # Makefile.libnx 固定链接 libretro_libnx.a 这个文件名，
          # LIBRETRO= 变量并不会改变链接目标，所以必须重命名。
          mv citra_libretro_libnx.a libretro_libnx.a
          make -f Makefile.libnx -j"$(nproc)"
          test -f retroarch_switch.nro
          mv retroarch_switch.nro citra_libretro_libnx.nro
          $DEVKITARM/bin/aarch64-none-elf-strip --strip-debug retroarch_switch.elf || true

      - name: Verify NRO header
        run: |
          python3 - <<'PY'
          import struct, os
          p = "retroarch/citra_libretro_libnx.nro"
          size = os.path.getsize(p)
          with open(p, "rb") as f:
              h = f.read(0x20)
              nro_end = struct.unpack("<I", h[0x18:0x1C])[0]
              f.seek(nro_end)
              tag = f.read(4)
          assert h[0x10:0x14] == b"NRO0", "magic 不是 NRO0"
          assert tag == b"ASET", "缺少 ASET 资源段"
          print(f"NRO 校验通过，{size/1024/1024:.1f} MB")
          PY

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: citra-libretro-switch
          path: retroarch/citra_libretro_libnx.nro
          retention-days: 30
          if-no-files-found: error
